<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adam Asmaca</title>
  <style>
    :root { --bg:#1e1e2f; --fg:#f5f5f5; --accent:#6c5ce7; --correct:#00b894; --wrong:#d63031; --button:#2d2d44; --button-active:#44446a; --coin:#fdcb6e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#313157 0,var(--bg) 52%); color:var(--fg); font-family:"Segoe UI",Arial,sans-serif; }
    main { width:min(100%,600px); min-height:100vh; padding:18px 18px 45px; text-align:center; display:flex; flex-direction:column; align-items:center; }
    .start-screen { position:fixed; z-index:5; inset:0; display:grid; place-items:center; padding:24px; overflow:hidden; background:radial-gradient(circle at 50% 25%,#44427a 0,#24243d 40%,var(--bg) 78%); transition:opacity .45s ease,visibility .45s ease; }
    .start-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .high-score { position:absolute; z-index:2; top:18px; left:18px; padding:9px 13px; border:1px solid rgba(255,255,255,.14); border-radius:10px; background:rgba(30,30,47,.72); color:#ffeaa7; font-size:.82rem; font-weight:800; box-shadow:0 5px 16px rgba(0,0,0,.2); }
    .high-coin { position:absolute; z-index:2; top:18px; right:18px; padding:9px 13px; border:1px solid rgba(255,255,255,.14); border-radius:10px; background:rgba(30,30,47,.72); color:var(--coin); font-size:.82rem; font-weight:800; box-shadow:0 5px 16px rgba(0,0,0,.2); }
    .start-screen::before,.start-screen::after { content:''; position:absolute; width:340px; height:340px; border:2px solid rgba(108,92,231,.24); border-radius:50%; animation:orbit 8s linear infinite; }
    .start-screen::after { width:500px; height:500px; border-color:rgba(0,184,148,.15); animation-direction:reverse; animation-duration:12s; }
    .start-card { position:relative; z-index:1; width:min(100%,420px); padding:34px 24px; border:1px solid rgba(255,255,255,.13); border-radius:25px; background:rgba(45,45,68,.78); box-shadow:0 18px 55px rgba(0,0,0,.35); backdrop-filter:blur(8px); text-align:center; }
    .logo-mark { display:block; width:190px; height:190px; margin:-20px auto 3px; border-radius:50%; object-fit:cover; opacity:1; mix-blend-mode:screen; filter:drop-shadow(0 10px 16px rgba(0,0,0,.35)); animation:float 2.6s ease-in-out infinite; }
    .start-card h1 { margin:0; color:#fff; font-size:clamp(2.35rem,11vw,3.6rem); line-height:1; letter-spacing:-.07em; text-shadow:0 5px 18px rgba(108,92,231,.6); }
    .start-card h1 span { color:var(--accent); }
    .start-card p { margin:18px auto 26px; max-width:290px; color:#d5d4e3; line-height:1.55; }
    .producer { margin:20px 0 0; color:#aaa8bd; font-size:.82rem; font-style:italic; }
    .start-button { display:block; width:min(100%,260px); margin:0 auto; padding:14px 20px; border:0; border-radius:12px; background:linear-gradient(135deg,#7d6df0,var(--accent)); color:#fff; font:800 1.12rem "Segoe UI",sans-serif; cursor:pointer; box-shadow:0 5px 0 #4436a2,0 12px 22px rgba(0,0,0,.25); transition:transform .15s,filter .15s; }
    .start-button:hover { transform:translateY(-2px); filter:brightness(1.1); }
    .start-button:active { transform:translateY(3px); box-shadow:0 2px 0 #4436a2; }
    @keyframes float { 50% { transform:translateY(-9px) rotate(4deg); } }
    @keyframes orbit { to { transform:rotate(360deg); } }
    .score-board { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:0 0 16px; }
    .score { margin:0; padding:9px 18px; border:3px solid #171724; border-radius:9px; background:var(--button); color:var(--accent); font-size:1.05rem; font-weight:800; box-shadow:0 3px 0 #09090e; }
    .best-score { color:#ffeaa7; }
    .coin-badge { color:var(--coin); }
    canvas { display:block; width:min(100%,330px); aspect-ratio:1; margin:0 auto 10px; }
    #word { min-height:48px; margin:8px 0; color:var(--accent); font-family:Consolas,monospace; font-weight:800; font-size:clamp(1.4rem,7vw,2.2rem); letter-spacing:.08em; word-break:break-all; }
    #status { min-height:24px; margin:4px 0 8px; }
    #result { min-height:34px; margin:2px 0 10px; font-size:1.45rem; font-weight:900; }
    .keys { display:grid; grid-template-columns:repeat(10,minmax(30px,1fr)); gap:6px; width:min(100%,500px); margin:5px 0 18px; }
    .key, .new-game, .main-menu, .hint-btn { border:0; border-radius:7px; color:var(--fg); font:800 1rem "Segoe UI",sans-serif; cursor:pointer; box-shadow:0 3px 0 #141420; transition:transform .12s,background .12s; }
    .key { min-height:39px; background:var(--button); }
    .key:hover:not(:disabled), .new-game:hover, .main-menu:hover, .hint-btn:hover:not(:disabled) { background:var(--button-active); transform:translateY(-1px); }
    .key:disabled { cursor:default; opacity:1; }
    .key.correct { background:var(--correct); }
    .key.wrong { background:var(--wrong); }
    .new-game { background:var(--accent); padding:11px 20px; font-size:1rem; }
    .new-game:hover { background:#5a4bd6; }
    .hint-btn { background:var(--coin); color:#1e1e2f; padding:11px 20px; font-size:1rem; box-shadow:0 3px 0 #c9a13b; }
    .hint-btn:hover:not(:disabled) { background:#f0b944; }
    .hint-btn:disabled { opacity:.45; cursor:default; pointer-events:none; }
    .game-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
    .main-menu { padding:11px 20px; background:var(--button); font-size:1rem; }
    footer { margin-top:auto; padding-top:18px; color:#888; font-size:.78rem; font-style:italic; }
    @media (max-width:380px) { main{padding-inline:10px}.keys{gap:4px}.key{min-height:35px;font-size:.85rem} }
  </style>
</head>
<body>
  <section class="start-screen" id="startScreen" aria-label="Oyun başlangıcı">
    <div class="high-score" id="highScore">🏆 En Yüksek Skor: 0</div>
    <div class="high-coin" id="highCoin">🪙 Coin: 0</div>
    <div class="start-card">
      <img class="logo-mark" src="Adsız tasarım.png" onerror="if(this.dataset.retry){this.onerror=null;this.src='assets/feyrex-logo.png'}else{this.dataset.retry='1';this.src='feyrex-logo.png'}" alt="FEYREX logosu">
      <h1>Adam <span>Asmaca</span></h1>
      <p>Harfleri tahmin et, kelimeyi tamamla ve darağacından önce kazan.</p>
      <button class="start-button" id="startGame">▶ Oyuna Başla</button>
      <div class="producer">Yapımcı: Aybars “FEYREX”</div>
    </div>
  </section>
  <main>
    <div class="score-board" aria-label="Skor tablosu">
      <div class="score" id="score">Skor: 0</div>
      <div class="score best-score" id="gameHighScore">🏆 En Yüksek: 0</div>
      <div class="score coin-badge" id="coinBadge">🪙 0</div>
    </div>
    <canvas id="gallows" width="300" height="300" aria-label="Adam asmaca çizimi"></canvas>
    <div id="word" aria-live="polite"></div>
    <div id="status" aria-live="polite"></div>
    <div id="result" aria-live="assertive"></div>
    <div class="keys" id="keys" aria-label="Harfler"></div>
    <div class="game-actions">
      <button class="hint-btn" id="hintBtn">💡 İpucu (15🪙)</button>
      <button class="new-game" id="newGame">🔄 Yeni Oyun</button>
      <button class="main-menu" id="mainMenu">⌂ Ana Menü</button>
    </div>
    <footer>Aybars “FEYREX”</footer>
  </main>
  <script>
    const WORDS = [
      'kalem','resim','deniz','bulut','kitap','masal','orman','sokak','yıldız','güneş','oyuncu','bilgisayar','telefon','araba','evcil','müzik','film','spor','tatil','yemek','sanat','eğitim','bilim','teknoloji','moda','hayvan','bitki','gezegen','uzay','tarih','dostluk','sevgi','mutluluk','huzur','cesaret','hayal','gerçek','macera','oyun','eğlence','dünya','kültür','sağlık','patlıcan','biber','soğan','sarımsak','havuç','patates','marul','ıspanak','lahana','bezelye','mercimek','nohut','fasulye','pirinç','buğday','mısır','arpa','yulaf','çay','kahve','süt','peynir','yumurta','ekmek','tereyağı','bal','reçel','pasta','kek','çorba','salata','köfte','pilav','döner','lahmacun'
    ];
    const LETTERS = [...'abcçdefgğhıijklmnoöprsştuüvyz'];
    const MAX_WRONG = 6;
    const HINT_COST = 15;
    const colors = { wood:'#8b5e34', wrong:'#d63031', skin:'#e0a878' };
    const canvas = document.querySelector('#gallows'), ctx = canvas.getContext('2d');
    const els = { score:document.querySelector('#score'), highScore:document.querySelector('#highScore'), gameHighScore:document.querySelector('#gameHighScore'), coinBadge:document.querySelector('#coinBadge'), highCoin:document.querySelector('#highCoin'), word:document.querySelector('#word'), status:document.querySelector('#status'), result:document.querySelector('#result'), keys:document.querySelector('#keys'), hintBtn:document.querySelector('#hintBtn') };
    let word, guessed, wrong, score = 0, ended, blink;
    let highScore = Number(localStorage.getItem('adam-asmaca-yuksek-skor')) || 0;
    let coin = Number(localStorage.getItem('adam-asmaca-coin')) || 0;

    function shade(hex, factor) { const n = parseInt(hex.slice(1),16), c = x => Math.round(factor >= 0 ? x+(255-x)*factor : x*(1+factor)); return '#' + [n>>16,(n>>8)&255,n&255].map(x=>c(x).toString(16).padStart(2,'0')).join(''); }
    function line3d(x1,y1,x2,y2,color,width=4) { ctx.lineCap='round'; ctx.strokeStyle=shade(color,-.45); ctx.lineWidth=width+3; ctx.beginPath();ctx.moveTo(x1+2,y1+2);ctx.lineTo(x2+2,y2+2);ctx.stroke(); ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke(); ctx.strokeStyle=shade(color,.35);ctx.lineWidth=Math.max(1,width-2);ctx.beginPath();ctx.moveTo(x1-1,y1-1);ctx.lineTo(x2-1,y2-1);ctx.stroke(); }
    function knob3d(x,y,r,color) { ctx.fillStyle=shade(color,-.4);ctx.beginPath();ctx.arc(x+1,y+1,r,0,Math.PI*2);ctx.fill(); ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill(); ctx.fillStyle=shade(color,.5);ctx.beginPath();ctx.arc(x-r*.3,y-r*.3,r*.35,0,Math.PI*2);ctx.fill(); }
    function ip(x1,y1,x2,y2) { ctx.strokeStyle='#c9a373'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke(); }
    function head3d(x,y,r,color,siddet) { for(let i=6;i>0;i--) { const ratio=i/6; ctx.fillStyle=shade(color,.3-(i/6)*.6);ctx.beginPath();ctx.arc(x,y,r*ratio,0,Math.PI*2);ctx.fill(); } ctx.strokeStyle=shade(color,-.5);ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle=shade(color,.6);ctx.beginPath();ctx.arc(x-r*.25,y-r*.3,r*.15,0,Math.PI*2);ctx.fill();
      // yüz ifadesi (siddet arttıkça daha endişeli görünür)
      const eyeY = y - r*0.08;
      ctx.fillStyle = '#1e1e2f';
      ctx.beginPath();ctx.arc(x-r*0.32, eyeY, r*0.1, 0, Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+r*0.32, eyeY, r*0.1, 0, Math.PI*2);ctx.fill();
      ctx.strokeStyle = '#1e1e2f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      const kasEgim = r*0.12 + siddet*r*0.18;
      ctx.beginPath();ctx.moveTo(x-r*0.46, eyeY-r*0.22-siddet*r*0.05);ctx.lineTo(x-r*0.16, eyeY-r*0.22+kasEgim*0.4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+r*0.46, eyeY-r*0.22-siddet*r*0.05);ctx.lineTo(x+r*0.16, eyeY-r*0.22+kasEgim*0.4);ctx.stroke();
      const agizY = y + r*0.38, kavis = -siddet*r*0.4;
      ctx.beginPath();ctx.moveTo(x-r*0.3, agizY);ctx.quadraticCurveTo(x, agizY+kavis, x+r*0.3, agizY);ctx.stroke();
    }
    function draw() { ctx.clearRect(0,0,300,300); const w=colors.wood, r=colors.skin, siddet=wrong/MAX_WRONG; line3d(35,265,180,265,w,5);line3d(70,265,70,25,w,5);line3d(70,25,190,25,w,5);line3d(190,25,190,60,w,5);
      if(wrong>=1){ ip(190,60,190,60+(88-28-60>0?88-28-60:16)); head3d(190,88,28,r,siddet); }
      if(wrong>=2) line3d(190,116,190,180,r,12);
      if(wrong>=3){ line3d(182,124,150,155,r,7); knob3d(150,155,6,r); }
      if(wrong>=4){ line3d(198,124,228,155,r,7); knob3d(228,155,6,r); }
      if(wrong>=5){ line3d(190,186,160,230,r,8); knob3d(160,230,7,r); }
      if(wrong>=6){ line3d(190,186,220,230,r,8); knob3d(220,230,7,r); }
    }
    function renderScore() { if(score>highScore){highScore=score;localStorage.setItem('adam-asmaca-yuksek-skor',highScore);} els.score.textContent=`Skor: ${score}`;els.highScore.textContent=`🏆 En Yüksek Skor: ${highScore}`;els.gameHighScore.textContent=`🏆 En Yüksek: ${highScore}`; }
    function renderCoin() { localStorage.setItem('adam-asmaca-coin', coin); els.coinBadge.textContent=`🪙 ${coin}`; els.highCoin.textContent=`🪙 Coin: ${coin}`; updateHintState(); }
    function updateHintState() { const kalan=[...word||''].filter(c=>!guessed.has(c)).length; els.hintBtn.disabled = ended || coin < HINT_COST || kalan === 0; }
    function update() { els.word.textContent=[...word].map(c=>guessed.has(c)?c.toLocaleUpperCase('tr-TR'):'_').join(' '); renderScore(); draw(); updateHintState(); }
    function finish(win) { ended=true; document.querySelectorAll('.key').forEach(b=>b.disabled=true); els.hintBtn.disabled=true; if(win){score+=20;coin+=10;renderScore();renderCoin();els.status.textContent='Kelimeyi buldun! (+20 skor, +10 🪙)';els.status.style.color='var(--correct)';flash('🎉 KAZANDIN! 🎉','var(--correct)');} else {els.status.textContent=`Doğru kelime: ${word.toLocaleUpperCase('tr-TR')}`;els.status.style.color='var(--wrong)';flash('💀 KAYBETTİN 💀','var(--wrong)');} }
    function flash(text,color) { clearInterval(blink); let on=false; blink=setInterval(()=>{on=!on;els.result.textContent=on?text:'';els.result.style.color=color;},500); }
    function guess(letter) { if(ended||guessed.has(letter))return; guessed.add(letter); const button=document.querySelector(`[data-letter="${letter}"]`);button.disabled=true; if([...word].includes(letter)){button.classList.add('correct');els.status.textContent=`Doğru! '${letter.toLocaleUpperCase('tr-TR')}' kelimede var.`;els.status.style.color='var(--correct)';score+=10;coin+=2;}else{button.classList.add('wrong');els.status.textContent=`Yanlış! '${letter.toLocaleUpperCase('tr-TR')}' kelimede yok.`;els.status.style.color='var(--wrong)';wrong++;score=Math.max(0,score-5);} update();renderCoin(); if([...word].every(c=>guessed.has(c)))finish(true);else if(wrong>=MAX_WRONG)finish(false); }
    function useHint() { if(ended||coin<HINT_COST)return; const kalanlar=[...word].filter(c=>!guessed.has(c)); if(!kalanlar.length)return; const letter=kalanlar[Math.floor(Math.random()*kalanlar.length)]; guessed.add(letter); coin-=HINT_COST; const button=document.querySelector(`[data-letter="${letter}"]`); if(button){button.classList.add('correct');button.disabled=true;} els.status.textContent=`İpucu: '${letter.toLocaleUpperCase('tr-TR')}' harfi açıldı.`;els.status.style.color='var(--coin)'; update();renderCoin(); if([...word].every(c=>guessed.has(c)))finish(true); }
    function newGame() { clearInterval(blink);word=WORDS[Math.floor(Math.random()*WORDS.length)];guessed=new Set();wrong=0;ended=false;els.result.textContent='';els.status.textContent='Bir harf seç!';els.status.style.color='var(--fg)';els.keys.innerHTML=''; LETTERS.forEach(letter=>{const b=document.createElement('button');b.className='key';b.dataset.letter=letter;b.textContent=letter.toLocaleUpperCase('tr-TR');b.addEventListener('click',()=>guess(letter));els.keys.append(b);});update();renderCoin(); }
    document.addEventListener('keydown',e=>{if(document.querySelector('#startScreen').classList.contains('hidden')){const letter=e.key.toLocaleLowerCase('tr-TR');if(LETTERS.includes(letter))guess(letter);}});
    document.querySelector('#newGame').addEventListener('click',newGame);
    document.querySelector('#hintBtn').addEventListener('click',useHint);
    document.querySelector('#startGame').addEventListener('click',()=>{document.querySelector('#startScreen').classList.add('hidden');newGame();});
    document.querySelector('#mainMenu').addEventListener('click',()=>{clearInterval(blink);document.querySelector('#startScreen').classList.remove('hidden');});
    renderScore();
    renderCoin();
  </script>
</body>
</html>
